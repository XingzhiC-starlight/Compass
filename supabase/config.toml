# The practice copy switches OFF two protections the live project keeps ON — the
# CAPTCHA and the wait for a confirmation email — so that a practice account can
# sign in at once. So this file must NEVER reach the live project: never run
# `supabase link`, `supabase config push` or `supabase db push` in this repository.

project_id = "compass-practice"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[local_smtp]
enabled = true
port = 55324

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5183"
additional_redirect_urls = ["http://localhost:5183/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
token_refresh = 1000

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1s"

[auth.email.template.recovery]
subject = "Reset your Compass password"
content_path = "./supabase/templates/recovery.html"
